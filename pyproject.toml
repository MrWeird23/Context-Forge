[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "contextforge"
description = "AI-first repository exploration for coding assistants."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]
authors = [
    { name = "ContextForge contributors" }
]
keywords = ["cli", "repository", "code-search", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "rich>=13.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "tree-sitter>=0.24,<0.26",
    "tree-sitter-javascript>=0.23,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.20",
    "pytest>=8",
]

[project.scripts]
cf = "contextforge.cli:main"

[project.urls]
Source = "https://github.com/MrWeird23/Context-Forge"

[tool.setuptools]
packages = ["contextforge"]

[tool.setuptools.data-files]
"share/contextforge" = [
    "CHANGELOG.md",
    "docs/benchmarks-0.3.0.md",
    "docs/json-schema-1.0.json",
]
"share/contextforge/benchmarks" = ["benchmarks/index_mixed_languages.py"]

[tool.setuptools.dynamic]
version = { attr = "contextforge.__version__" }
